name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Generated output is never committed; what is gated is that it is
      # byte-identical across runs (two fresh generations, compared).
      - name: determinism
        run: |
          cargo build --release -p sealmap
          for i in 1 2; do target/release/sealmap generate . --name sealmap -o "$RUNNER_TEMP/gen$i"; done
          diff -r "$RUNNER_TEMP/gen1" "$RUNNER_TEMP/gen2"
          # A review pack is byte-identical too, whatever the order of its topics.
          target/release/sealmap pack COR-04 DEN-01 --name sealmap > "$RUNNER_TEMP/pack1.txt"
          target/release/sealmap pack DEN-01 COR-04 --name sealmap > "$RUNNER_TEMP/pack2.txt"
          cmp "$RUNNER_TEMP/pack1.txt" "$RUNNER_TEMP/pack2.txt"

  # The declared MSRV (workspace `rust-version`). `--locked` keeps the
  # lockfile's `ignore 0.4.29`: 0.4.30 uses let-chains (Rust 1.88) without
  # declaring a rust-version, so the MSRV-aware resolver cannot avoid it.
  msrv:
    name: rust 1.85 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Render a freshly generated corpus: nothing generated is committed.
      - run: cargo run --release -p sealmap -- generate . --name sealmap -o .sealmap
      # A full render with Pele, not just a parse: some faults (layout, keyword
      # aliases) only surface when the diagram is laid out.
      - run: node tools/validate-mermaid.mjs $(find .sealmap -name '*.md')
        env:
          MODE: render

  # The hand-authored corpus: structure, every path:line citation resolved at
  # its topic's declared verified_commit (hence full history), and a Pele
  # render of every diagram (in-process, no browser) with the 4500 px ceiling.
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/diagrams/tools/diagram-index-gen.cjs docs/diagrams --check --cite-check --strict-citations
      - run: node docs/diagrams/tools/diagram-index-gen.cjs docs/diagrams --check --render
